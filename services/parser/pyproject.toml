[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoe2-parser"
version = "0.1.0"
description = "Parses Age of Empires II: DE replays (.aoe2record) into normalized JSON."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mgz==1.8.51"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aoe2-parser = "aoe2_parser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aoe2_parser.vendor" = ["LICENSE.mgz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
