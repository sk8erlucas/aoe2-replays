[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoe2-parser"
version = "0.1.0"
description = "Parses Age of Empires II: DE replays (.aoe2record) into normalized JSON."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mgz==1.8.51", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.14,<0.15"]

[project.scripts]
aoe2-parser = "aoe2_parser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aoe2_parser.vendor" = ["LICENSE.mgz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Patched copy of mgz: kept close to upstream, not reformatted.
extend-exclude = ["src/aoe2_parser/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters as defaults: File(...) is not a mutable default.
extend-immutable-calls = ["fastapi.File"]
